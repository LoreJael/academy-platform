services:
  users-service:
    build: ./users-service
    ports:
      - "3000:3000"
    env_file:
      - ./users-service/.env

  classes-service:
    build: ./classes-service
    ports:
      - "3001:3001"
    env_file:
      - ./classes-service/.env
    environment:
      - USERS_SERVICE_URL=http://users-service:3000
    depends_on:
      - users-service