<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Academia — Reservas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Academia</h1>

    <section id="login-section">
        <h2>Iniciar sesión</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btn-login">Entrar</button>
        <p id="login-mensaje"></p>
    </section>

    <section id="app-section" style="display:none;">
        <p>Hola, <span id="usuario-nombre"></span> — <button id="btn-logout">Salir</button></p>

        <h2>Clases disponibles</h2>
        <ul id="lista-clases"></ul>

        <h2>Mis reservas</h2>

                <section id="admin-section" style="display:none;">
            <h2>Administración</h2>

            <h3>Nueva disciplina</h3>
            <input type="text" id="admin-disciplina-nombre" placeholder="Nombre de la disciplina">
            <button id="btn-crear-disciplina">Crear disciplina</button>
            <p id="admin-disciplina-mensaje"></p>

            <h3>Nueva clase</h3>
            <select id="admin-clase-disciplina"></select>
            <select id="admin-clase-profesor"></select>
            <input type="text" id="admin-clase-dia" placeholder="Día (ej. Lunes)">
            <input type="time" id="admin-clase-hora">
            <input type="number" id="admin-clase-duracion" placeholder="Duración (min)">
            <input type="number" id="admin-clase-cupo" placeholder="Cupo">
            <button id="btn-crear-clase">Crear clase</button>
            <p id="admin-clase-mensaje"></p>
        </section>
        
        <ul id="lista-reservas"></ul>
    </section>

    <script src="app.js"></script>
</body>
</html>
